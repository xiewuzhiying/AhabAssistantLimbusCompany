name: Linux source checks
on:
  pull_request:
  workflow_dispatch:
jobs:
  source:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:bookworm, archlinux:base]
    container: ${{ matrix.image }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .
    steps:
      - name: Install system libraries
        run: |
          if command -v apt-get; then
            apt-get update
            apt-get install -y build-essential linux-libc-dev git curl ca-certificates libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 libfontconfig1 libzstd1
          else
            pacman -Syu --noconfirm base-devel linux-api-headers git curl ca-certificates libglvnd libxkbcommon dbus glib2 fontconfig zstd
          fi
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --frozen
      - run: uv run python -c "import PySide6, cv2, onnxruntime, Xlib"
      - run: uv run pytest -q
